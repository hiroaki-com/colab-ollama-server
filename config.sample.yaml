# Continue Extension Configuration Sample
# =========================================
# Place this file at: ~/.continue/config.yaml
#
# Usage:
#   1. Start the Ollama Colab Free Server and copy the endpoint URL displayed in the output.
#   2. Replace all occurrences of https://xxxx.ngrok-free.app with your actual ngrok URL.
#   3. Uncomment or remove models you do not need.

name: Colab Cloud Config
version: 1.0.0
schema: v1
models:
  - name: qwen3:8b (ollama-colab-server)
    provider: ollama
    model: qwen3:8b
    apiBase: https://xxxx.ngrok-free.dev
    apiKey: ollama
    roles: [chat, edit, apply]
    defaultCompletionOptions:
      temperature: 0.4
      maxTokens: 2048
    contextLength: 32768
  - name: qwen3:14b (ollama-colab-server)
    provider: ollama
    model: qwen3:14b
    apiBase: https://xxxx.ngrok-free.dev
